[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bashtool"
version = "0.1.0"
description = "A secure, sandboxed bash execution tool for LLM agents with LangChain integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "BashTool Team", email = "team@bashtool.dev"}
]
keywords = ["llm", "bash", "shell", "langchain", "agent", "sandbox", "tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sujaychandrakoyyalamudi/BashTool"
Documentation = "https://github.com/sujaychandrakoyyalamudi/BashTool#readme"
Repository = "https://github.com/sujaychandrakoyyalamudi/BashTool.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = true
